{{define "layout"}}<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} | 日商簿記3級 問題集</title>
<link rel="stylesheet" href="/static/css/app.css">
<script nonce="{{.CSPNonce}}" src="/static/js/htmx.min.js" defer></script>
<script nonce="{{.CSPNonce}}" src="/static/js/alpine.min.js" defer></script>
</head>
<body class="washi">
<header class="topbar">
  <h1 class="brand"><a href="/">簿記3級 問題集</a></h1>
  {{if .User}}
  <nav class="nav">
    <a href="/quiz">学習</a>
    <a href="/progress">進捗</a>
    <a href="/history">履歴</a>
    <a href="/settings">設定</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button class="link" type="submit">ログアウト</button>
    </form>
  </nav>
  {{end}}
</header>
<main class="container">
{{template "content" .}}
</main>
<footer class="foot">
  <p>© 2026 boki3-quiz · 標準ライブラリ + HTMX + Alpine.js</p>
</footer>
</body>
</html>{{end}}
